<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nocturnal Inebriates - Loading</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --void: #000000;
    --ink: #07070f;
    --violet-deep: #7a4f0a;
    --violet: #f2a81d;
    --violet-glow: #ffd36a;
    --lilac: #fff0cf;
    --font-pixel: "Silkscreen", "Courier New", monospace;
    --font-body: "VT323", "Courier New", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: #02030f; overflow: hidden; }
  body {
    color: var(--lilac);
    font-family: var(--font-body);
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* soft moonlit glow + scanlines */
  body::before {
    content: "";
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 38%, rgba(110,70,210,.30), transparent 62%);
    pointer-events: none;
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px);
    pointer-events: none;
    z-index: 10;
  }

  #stars { position: fixed; inset: 0; z-index: 0; }
  .star {
    position: absolute; width: 4px; height: 4px;
    background: var(--violet-glow);
    box-shadow: 0 0 8px var(--violet-glow);
    opacity: .2;
    animation: twinkle var(--d, 4s) steps(2, end) infinite;
    animation-delay: var(--delay, 0s);
  }
  @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }

  main {
    position: relative; z-index: 2;
    width: min(920px, 92vw);
    display: flex; flex-direction: column; align-items: center;
    gap: 18px;
  }

  .logo {
    width: 100%;
    display: block;
    image-rendering: auto;
    filter: drop-shadow(0 0 28px rgba(242,168,29,.55));
    animation: bob 5s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  .panel { width: 100%; display: flex; flex-direction: column; gap: 12px; }

  .meta {
    display: flex; justify-content: space-between; align-items: flex-end; gap: 16px;
    font-family: var(--font-pixel);
    font-size: 13px;
    color: var(--violet-glow);
    letter-spacing: .04em;
  }
  .meta strong { display: block; color: #fff; font-size: 17px; font-weight: 700; margin-bottom: 4px; text-shadow: 0 0 10px var(--violet); }
  .meta .right { text-align: right; }

  /* chunky segmented progress bar */
  .bar {
    position: relative;
    height: 34px;
    border: 4px solid var(--violet);
    background: var(--ink);
    box-shadow: 0 0 0 4px var(--void), 0 0 0 6px var(--violet-deep), 0 0 24px rgba(242,168,29,.5);
    padding: 4px;
  }
  .fill {
    height: 100%; width: 0%;
    background:
      repeating-linear-gradient(to right, transparent 0 18px, var(--ink) 18px 22px),
      linear-gradient(to bottom, var(--lilac) 0 20%, var(--violet-glow) 20% 60%, var(--violet) 60%);
    box-shadow: 0 0 14px var(--violet-glow);
  }
  .pct {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    font-family: var(--font-pixel); font-size: 13px; color: #fff; text-shadow: 2px 2px 0 var(--void);
    mix-blend-mode: normal;
  }

  .status {
    display: flex; justify-content: space-between; gap: 16px;
    min-height: 26px; line-height: 1.1;
  }
  #status { color: #fff; }
  #file { color: var(--violet-glow); text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; }

  .tip {
    border-left: 4px solid var(--violet);
    padding: 6px 14px;
    min-height: 62px;
    background: linear-gradient(to right, rgba(242,168,29,.18), transparent);
    font-size: 24px;
    line-height: 1.15;
    transition: opacity .4s steps(4);
  }
  .tip.out { opacity: 0; }
  .tip b { font-family: var(--font-pixel); font-size: 13px; color: var(--violet-glow); margin-right: 8px; font-weight: 700; }

  .rules {
    display: flex; gap: 10px 28px; flex-wrap: wrap; justify-content: center;
    font-size: 20px; color: var(--violet-glow);
  }
  .rules span::before { content: "\25AA "; color: var(--violet); }

  @media (max-width: 640px) {
    body { font-size: 18px; }
    .meta { font-size: 11px; } .meta strong { font-size: 14px; }
    .tip { font-size: 20px; }
    .bar { height: 28px; }
  }
  @media (max-height: 620px) { .rules { display: none; } main { gap: 10px; } }
  @media (prefers-reduced-motion: reduce) { .logo, .star { animation: none; } }
  .logo{filter:none;width:auto;max-width:100%;max-height:54vh;-webkit-mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 8%,#000 92%,transparent),linear-gradient(to bottom,transparent,#000 8%,#000 92%,transparent);mask-composite:intersect;}
  @media (max-height:700px){.tip{display:none}}
</style>
</head>

      <div class="right"><strong id="mapName">Loading map</strong><span id="players"></span></div>

      <span id="status">Connecting to server...</span>

  </section>
</main>

<script>
/* ============ EDIT THIS SECTION ============ */
const CONFIG = {
  // Used until the game reports the real server name.
  serverName: "Nocturnal Inebriates TTT",
  // Rules shown at the bottom of the screen.
  rules: [
    "No RDM (random deathmatch)",
    "No metagaming from dead chat",
    "Don't ghost or leak roles",
    "Respect the Detectives' calls",
    "Be cool, have fun"
  ],
  // Tips that rotate while loading.
  tips: [
    ["Tip", "Traitors can buy gear in the shop with credits. Press C to open it."],
    ["Tip", "Found a body? Look at it and press E to search it and call it in."],
    ["Tip", "Detectives can use the DNA scanner on weapons and bodies to track killers."],
    ["Tip", "Stick together. A lone innocent is the easiest target on the map."],
    ["Tip", "Never take credit for a kill you didn't see. Call what you actually saw."],
    ["Tip", "Dead players can't talk to the living. Keep spoilers out of voice chat."],
    ["Tip", "Hold Q for the weapon menu to swap fast during a fight."],
    ["Tip", "Suspicious of a teammate? Make them prove it. Don't shoot on a hunch."]
  ],
  tipSeconds: 6,
  // Set to false to disable the preview animation when opened in a normal browser.
  demoInBrowser: true
};
/* ============================================ */

const $ = id => document.getElementById(id);
let totalFiles = 0, neededFiles = 0;
let target = 0, shown = 0;
let gmodActive = false;

/* ---- stars ---- */
(function () {
  const wrap = $("stars");
  for (let i = 0; i < 46; i++) {
    const s = document.createElement("i");
    s.className = "star";
    s.style.left = Math.random() * 100 + "%";
    s.style.top = Math.random() * 100 + "%";
    s.style.setProperty("--d", (2.5 + Math.random() * 4).toFixed(1) + "s");
    s.style.setProperty("--delay", (Math.random() * 4).toFixed(1) + "s");
    wrap.appendChild(s);
  }
})();

/* ---- rules ---- */
CONFIG.rules.forEach(r => {
  const el = document.createElement("span");
  el.textContent = r;
  $("rules").appendChild(el);
});

/* ---- tips ---- */
let tipIndex = Math.floor(Math.random() * CONFIG.tips.length);
function showTip() {
  const t = CONFIG.tips[tipIndex % CONFIG.tips.length];
  const el = $("tip");
  el.classList.add("out");
  setTimeout(() => {
    el.innerHTML = "";
    const b = document.createElement("b"); b.textContent = t[0];
    el.appendChild(b);
    el.appendChild(document.createTextNode(t[1]));
    el.classList.remove("out");
  }, 400);
  tipIndex++;
}
showTip();
setInterval(showTip, CONFIG.tipSeconds * 1000);

/* ---- progress ---- */
function setProgress(p) { target = Math.max(0, Math.min(100, p)); }
function render() {
  shown += (target - shown) * 0.08;
  if (Math.abs(target - shown) < 0.05) shown = target;
  const v = Math.round(shown);
  $("fill").style.width = shown + "%";
  $("pct").textContent = v + "%";
  document.querySelector(".bar").setAttribute("aria-valuenow", v);
  requestAnimationFrame(render);
}
requestAnimationFrame(render);

function updateFromFiles() {
  if (totalFiles > 0) setProgress(((totalFiles - neededFiles) / totalFiles) * 100);
}

/* ---- Garry's Mod callbacks (called by the game) ---- */
function GameDetails(servername, serverurl, mapname, maxplayers, steamid, gamemode) {
  gmodActive = true;
  if (servername) $("serverName").textContent = servername;
  if (mapname) $("mapName").textContent = mapname;
  if (maxplayers) $("players").textContent = maxplayers + " player slots";
  if (gamemode) $("gamemode").textContent = gamemode;
}
function SetFilesTotal(total) { gmodActive = true; totalFiles = Number(total) || 0; updateFromFiles(); }
function SetFilesNeeded(needed) { gmodActive = true; neededFiles = Number(needed) || 0; updateFromFiles(); }
function DownloadingFile(fileName) {
  gmodActive = true;
  $("status").textContent = "Downloading files...";
  $("file").textContent = String(fileName || "").split("/").pop();
}
function SetStatusChanged(status) {
  gmodActive = true;
  $("status").textContent = status;
  $("file").textContent = "";
  // Fallback progress when the game doesn't report file counts.
  if (totalFiles === 0) {
    const s = String(status).toLowerCase();
    if (s.includes("workshop")) setProgress(25);
    else if (s.includes("sending client info")) setProgress(60);
    else if (s.includes("starting lua")) setProgress(85);
    else if (s.includes("client info") || s.includes("signon")) setProgress(95);
  }
}

/* ---- browser preview (only runs if the game never calls in) ---- */
setTimeout(() => {
  if (gmodActive || !CONFIG.demoInBrowser) return;
  $("serverName").textContent = CONFIG.serverName;
  $("mapName").textContent = "ttt_minecraft_b5";
  $("players").textContent = "24 player slots";
  const steps = [
    [10, "Retrieving server info..."],
    [30, "Mounting Workshop content..."],
    [55, "Downloading files...", "cl_tags.lua"],
    [72, "Sending client info..."],
    [90, "Starting Lua..."],
    [100, "Ready to join"]
  ];
  let i = 0;
  (function next() {
    if (gmodActive || i >= steps.length) return;
    const [p, text, f] = steps[i++];
    setProgress(p); $("status").textContent = text; $("file").textContent = f || "";
    setTimeout(next, 1800);
  })();
}, 1200);
</script>
</body>
</html>
